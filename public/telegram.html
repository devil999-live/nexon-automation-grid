<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Anti-Revoke Logger - Nexon Hub</title>
    <style>
        :root {
            --bg-base: #090d16;
            --metallic-panel: linear-gradient(135deg, rgba(20, 27, 45, 0.95) 0%, rgba(10, 14, 26, 0.98) 100%);
            --metallic-border: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(30, 41, 59, 0.8), rgba(56, 189, 248, 0.2));
            --neon-cyan: #38bdf8;
            --neon-emerald: #34d399;
            --neon-rose: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.25) 0%, transparent 60%),
                linear-gradient(rgba(15, 23, 42, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px; z-index: 999; pointer-events: none; opacity: 0.35;
        }

        .wrapper { max-width: 750px; margin: 0 auto; position: relative; z-index: 2; }
        .back-btn { display: inline-block; color: var(--neon-cyan); text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        
        .panel {
            background: var(--metallic-panel);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-image: var(--metallic-border) 1;
            border-radius: 14px; padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-emerald));
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        h2 { color: var(--neon-cyan); margin-bottom: 8px; font-size: 1.6rem; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; line-height: 1.5; }

        .switch-row {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(2, 6, 23, 0.9); padding: 18px 22px; border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3); margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .switch { position: relative; display: inline-block; width: 56px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #0f172a; transition: .4s; border-radius: 28px; border: 1px solid #475569; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        input:checked + .slider { background-color: var(--neon-emerald); border-color: var(--neon-emerald); box-shadow: 0 0 15px var(--neon-emerald); }
        input:checked + .slider:before { transform: translateX(28px); }
        #toggle-label { font-weight: bold; font-size: 0.95rem; letter-spacing: 1px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
        input[type="text"] {
            width: 100%; background: rgba(2, 6, 23, 0.95); border: 1px solid #334155; padding: 14px;
            color: var(--text-main); border-radius: 8px; font-size: 0.95rem; outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
        }
        input[type="text"]:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(56,189,248,0.4); }

        .btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #090d16; border: none;
            padding: 14px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1.5px; width: 100%; transition: 0.3s; margin-top: 10px;
            box-shadow: 0 0 20px rgba(56,189,248,0.4);
        }
        .btn:hover { box-shadow: 0 0 30px rgba(56,189,248,0.8); transform: translateY(-1px); }
        #status-msg { margin-top: 18px; font-size: 0.9rem; font-weight: bold; color: var(--neon-emerald); text-align: center; text-shadow: 0 0 8px rgba(52,211,153,0.4); }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="wrapper">
        <a href="index.html" class="back-btn">&larr; Back to Control Hub</a>
        <div class="panel">
            <h2>🛡️ Telegram Anti-Revoke Logger Control</h2>
            <p class="subtitle">Manage independent Telegram integration settings. When active, incoming WhatsApp messages stream directly to your Telegram chat independently of the auto-reply bot module.</p>
            
            <div class="switch-row">
                <span id="toggle-label">TG LOGGER: OFF</span>
                <label class="switch">
                    <input type="checkbox" id="tg-enabled-toggle" onchange="updateToggleState()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label>Telegram Bot Token:</label>
                <input type="text" id="tg-token" placeholder="Enter Telegram Bot Token...">
            </div>

            <div class="form-group">
                <label>Telegram Chat ID:</label>
                <input type="text" id="tg-chatid" placeholder="Enter Telegram Chat ID...">
            </div>

            <button class="btn" onclick="saveSettings()">Save Configuration & Credentials</button>
            <p id="status-msg"></p>
        </div>
    </div>

    <script>
        async function loadSettings() {
            try {
                const res = await fetch('/api/telegram-settings');
                const data = await res.json();
                document.getElementById('tg-enabled-toggle').checked = data.enabled;
                document.getElementById('tg-token').value = data.botToken || '';
                document.getElementById('tg-chatid').value = data.chatId || '';
                updateLabelStyle(data.enabled);
            } catch (e) { console.error('Failed to load Telegram settings:', e); }
        }

        function updateLabelStyle(enabled) {
            const lbl = document.getElementById('toggle-label');
            lbl.textContent = enabled ? "TG LOGGER: ACTIVE (Independent)" : "TG LOGGER: OFF";
            lbl.style.color = enabled ? "var(--neon-emerald)" : "var(--neon-rose)";
        }

        async function updateToggleState() {
            const enabled = document.getElementById('tg-enabled-toggle').checked;
            updateLabelStyle(enabled);
            await fetch('/api/telegram-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            });
        }

        async function saveSettings() {
            const enabled = document.getElementById('tg-enabled-toggle').checked;
            const botToken = document.getElementById('tg-token').value.trim();
            const chatId = document.getElementById('tg-chatid').value.trim();

            const res = await fetch('/api/telegram-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled, botToken, chatId })
            });
            const data = await res.json();
            const msg = document.getElementById('status-msg');
            msg.textContent = data.status;
            setTimeout(() => { msg.textContent = ''; }, 3500);
        }

        window.onload = loadSettings;
    </script>
</body>
</html>
