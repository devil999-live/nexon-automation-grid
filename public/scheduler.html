<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduler - Nexon</title>
    <style>
        :root {
            --bg-base: #090d16;
            --metallic-panel: linear-gradient(135deg, rgba(20, 27, 45, 0.95) 0%, rgba(10, 14, 26, 0.98) 100%);
            --neon-cyan: #38bdf8;
            --neon-emerald: #34d399;
            --neon-amber: #fbbf24;
            --neon-rose: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.25) 0%, transparent 60%),
                linear-gradient(rgba(15, 23, 42, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main); min-height: 100vh; padding: 40px;
        }
        .wrapper { max-width: 900px; margin: 0 auto; }
        .back-btn { display: inline-block; color: var(--neon-cyan); text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; text-shadow: 0 0 8px rgba(56,189,248,0.4); }
        .panel {
            background: var(--metallic-panel);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 14px; padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-emerald));
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        h2 { color: var(--neon-cyan); margin-bottom: 20px; text-shadow: 0 0 12px rgba(56,189,248,0.6); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
        
        input[type="text"], textarea {
            width: 100%; background: rgba(2, 6, 23, 0.95); border: 1px solid #334155; padding: 12px;
            color: var(--text-main); border-radius: 8px; font-size: 0.9rem; outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        input:focus, textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(56,189,248,0.4); }

        /* GLOWING METALLIC DATE/TIME INPUT */
        input[type="datetime-local"] {
            width: 100%; background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(2, 6, 23, 0.98) 100%);
            border: 1px solid var(--neon-cyan); padding: 12px; color: var(--neon-cyan);
            border-radius: 8px; font-size: 0.95rem; font-weight: bold; outline: none; cursor: pointer;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        input[type="datetime-local"]:hover, input[type="datetime-local"]:focus {
            border-color: var(--neon-emerald); color: var(--neon-emerald);
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.5), inset 0 2px 4px rgba(0,0,0,0.6);
        }

        /* GLOWING METALLIC FILE ATTACHMENT BOX */
        .file-upload-box {
            border: 2px dashed var(--neon-cyan);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.95) 100%);
            padding: 15px; border-radius: 8px; text-align: center; cursor: pointer;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2), inset 0 0 8px rgba(56, 189, 248, 0.1);
            transition: all 0.3s ease;
        }
        .file-upload-box:hover {
            border-color: var(--neon-emerald);
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.4), inset 0 0 12px rgba(52, 211, 153, 0.2);
            transform: translateY(-2px);
        }

        /* DYNAMIC GLOWING BUTTON */
        .btn {
            background: linear-gradient(135deg, #059669 0%, #047857 100%); color: white; border: none;
            padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1.2px; width: 100%; box-shadow: 0 0 15px rgba(5, 150, 105, 0.4); transition: all 0.3s ease;
        }
        .btn:hover { box-shadow: 0 0 25px rgba(52,211,153,0.8); transform: translateY(-1px); }
        .btn-danger { background: linear-gradient(135deg, #e11d48 0%, #be123c 100%); padding: 5px 10px; font-size: 0.75rem; color: white; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 0 10px rgba(225,29,72,0.4); }

        .contact-list-box { max-height: 180px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; background: rgba(2, 6, 23, 0.85); padding: 8px; margin-bottom: 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
        .contact-item { padding: 8px 12px; border-bottom: 1px solid rgba(51, 65, 85, 0.4); font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .contact-item:hover { background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="index.html" class="back-btn">← Back to Hub</a>
        <div class="panel">
            <h2>⏰ Message Scheduler & Multi-File Dispatcher</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Select Recipients:</label>
                    <input type="text" id="schedule-contact-search" placeholder="Search contact..." onkeyup="filterScheduleContacts()" style="margin-bottom: 8px;">
                    <div class="contact-list-box" id="schedule-contacts-box"></div>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Select Date & Time (Glow Picker):</label>
                    <input type="datetime-local" id="schedule-datetime" style="margin-bottom: 15px;">
                    
                    <label>Choose Multiple Attachment Files from PC:</label>
                    <div class="file-upload-box" onclick="document.getElementById('schedule-media-file').click()">
                        <p style="font-size: 0.85rem; color: var(--neon-cyan); font-weight: bold;" id="file-chosen-label">📂 Click to select multiple files from PC</p>
                        <!-- 'multiple' attribute allows selecting multiple files at once -->
                        <input type="file" id="schedule-media-file" multiple style="display: none;">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Message Content / Caption:</label>
                <textarea id="schedule-message-text" rows="3" placeholder="Type message..."></textarea>
            </div>
            <button class="btn" onclick="saveScheduledMessage()">📅 Schedule Message with Multiple Files</button>

            <h3 style="color: var(--neon-cyan); font-size: 1rem; margin-top: 30px; margin-bottom: 12px;">Active Scheduled Queue</h3>
            <div class="contact-list-box" id="scheduled-list-box" style="max-height: 180px;"></div>
        </div>
    </div>
    <script>
        let cachedContacts = [];
        
        document.getElementById('schedule-media-file').addEventListener('change', function() {
            if(this.files.length > 0) {
                document.getElementById('file-chosen-label').textContent = `✨ ${this.files.length} file(s) selected`;
            } else {
                document.getElementById('file-chosen-label').textContent = '📂 Click to select multiple files from PC';
            }
        });

        async function init() {
            try {
                const resC = await fetch('/api/contacts');
                cachedContacts = await resC.json();
                renderScheduleContactsList(cachedContacts);
                fetchScheduledMessages();
            } catch(e) { console.error(e); }
        }

        function renderScheduleContactsList(contacts, query = '') {
            const box = document.getElementById('schedule-contacts-box');
            if (!contacts.length) { box.innerHTML = `<div class="contact-item" style="color: var(--text-muted);">No contacts. Upload VCF first.</div>`; return; }
            const filtered = contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.id.includes(query));
            box.innerHTML = '';
            filtered.forEach(c => {
                box.innerHTML += `
                    <div class="contact-item">
                        <input type="checkbox" class="schedule-contact-cb" value="${c.id}" style="width: auto; cursor: pointer;">
                        <span style="flex-grow: 1;">${c.name}</span>
                        <span style="color: var(--neon-cyan); font-size: 0.75rem;">${c.id}</span>
                    </div>
                `;
            });
        }
        function filterScheduleContacts() {
            renderScheduleContactsList(cachedContacts, document.getElementById('schedule-contact-search').value);
        }
        async function saveScheduledMessage() {
            const checkboxes = document.querySelectorAll('.schedule-contact-cb:checked');
            let contactIds = []; checkboxes.forEach(cb => contactIds.push(cb.value));
            const datetime = document.getElementById('schedule-datetime').value;
            const message = document.getElementById('schedule-message-text').value;
            const fileInput = document.getElementById('schedule-media-file');

            if (!contactIds.length || !datetime || !message) return alert('Select contacts, datetime, and message!');

            const formData = new FormData();
            formData.append('contactIds', JSON.stringify(contactIds));
            formData.append('datetime', datetime);
            formData.append('message', message);
            
            // Append multiple files loop into formData
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('mediaFiles', fileInput.files[i]);
            }

            const res = await fetch('/api/schedule', { method: 'POST', body: formData });
            alert((await res.json()).status);
            
            fileInput.value = ''; 
            document.getElementById('file-chosen-label').textContent = '📂 Click to select multiple files from PC';
            fetchScheduledMessages();
        }
        async function fetchScheduledMessages() {
            const res = await fetch('/api/schedule');
            const list = await res.json();
            const box = document.getElementById('scheduled-list-box');
            if (!list.length) { box.innerHTML = `<div class="contact-item" style="color: var(--text-muted); justify-content: center;">No scheduled messages.</div>`; return; }
            box.innerHTML = '';
            list.forEach(s => {
                box.innerHTML += `
                    <div class="contact-item" style="justify-content: space-between;">
                        <span><b>To:</b> ${s.contactIds.length} contact(s) | <b>Time:</b> ${s.datetime}</span>
                        <span style="color: var(--neon-amber);">${s.message}</span>
                        <button class="btn-danger" onclick="cancelSchedule('${s.id}')">Cancel</button>
                    </div>
                `;
            });
        }
        async function cancelSchedule(id) {
            await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
            fetchScheduledMessages();
        }
        window.onload = init;
    </script>
</body>
</html>
