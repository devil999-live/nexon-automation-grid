<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Feed - Nexon</title>
    <style>
        :root {
            --bg-base: #090d16;
            --metallic-panel: linear-gradient(135deg, rgba(20, 27, 45, 0.95) 0%, rgba(10, 14, 26, 0.98) 100%);
            --neon-cyan: #38bdf8;
            --neon-emerald: #34d399;
            --neon-amber: #fbbf24;
            --neon-rose: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.25) 0%, transparent 60%),
                linear-gradient(rgba(15, 23, 42, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main); min-height: 100vh; padding: 40px;
        }
        .wrapper { max-width: 950px; margin: 0 auto; }
        .back-btn { display: inline-block; color: var(--neon-cyan); text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; text-shadow: 0 0 8px rgba(56,189,248,0.4); }
        .panel {
            background: var(--metallic-panel); border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px; padding: 35px; box-shadow: 0 15px 45px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-emerald));
            box-shadow: 0 0 12px var(--neon-cyan);
        }
        h2 { color: var(--neon-cyan); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 0 10px rgba(56,189,248,0.4); }
        .btn-alt {
            background: linear-gradient(135deg, #059669 0%, #047857 100%); color: white; border: none;
            padding: 8px 14px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(5,150,105,0.3); transition: 0.3s;
        }
        .btn-alt:hover { box-shadow: 0 4px 15px rgba(52,211,153,0.5); transform: translateY(-1px); }
        .contact-list-box { max-height: 480px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; background: rgba(2, 6, 23, 0.85); padding: 8px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
        .history-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid rgba(51,65,85,0.4); font-size: 0.82rem; gap: 12px; cursor: pointer; transition: 0.2s; }
        .history-row:hover { background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.4); }
        .history-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; text-transform: uppercase; font-weight: bold; }
        .badge-scheduled { background: rgba(251,191,36,0.2); color: var(--neon-amber); border: 1px solid rgba(251,191,36,0.4); }
        .badge-batch { background: rgba(52,211,153,0.2); color: var(--neon-emerald); border: 1px solid rgba(52,211,153,0.4); }
        .badge-fallback { background: rgba(244,63,94,0.2); color: var(--neon-rose); border: 1px solid rgba(244,63,94,0.4); }
        .badge-incoming { background: rgba(56,189,248,0.2); color: var(--neon-cyan); border: 1px solid rgba(56,189,248,0.4); }
        .badge-system { background: rgba(148,163,184,0.2); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.4); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: var(--metallic-panel); border: 1px solid var(--neon-cyan);
            border-radius: 12px; width: 100%; max-width: 600px; padding: 30px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); position: relative;
        }
        .modal-content h3 { color: var(--neon-cyan); margin-bottom: 15px; font-size: 1.2rem; }
        .modal-body { font-size: 0.88rem; line-height: 1.6; color: var(--text-main); margin-bottom: 20px; word-break: break-all; }
        .modal-body p { margin-bottom: 8px; }
        .modal-body span { color: var(--text-muted); }
        .modal-close {
            background: var(--neon-rose); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; float: right;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="index.html" class="back-btn">← Back to Hub</a>
        <div class="panel">
            <h2>
                📊 Live Analytics & System Audit Feed
                <button class="btn-alt" onclick="fetchHistoryLogs()">Refresh Logs</button>
            </h2>
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px;">Click any log row to inspect complete event payload, timestamp, and details.</p>
            <div class="contact-list-box" id="history-list-box"></div>
        </div>
    </div>

    <div class="modal-overlay" id="log-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>🔍 Log Event Inspector</h3>
            <div class="modal-body" id="modal-details-body"></div>
            <button class="modal-close" onclick="closeModal()">Close</button>
            <div style="clear: both;"></div>
        </div>
    </div>

    <script>
        let globalLogs = [];

        async function fetchHistoryLogs() {
            try {
                const res = await fetch('/api/history');
                globalLogs = await res.json();
                const box = document.getElementById('history-list-box');
                if (!globalLogs.length) { 
                    box.innerHTML = `<div class="history-row" style="color: var(--text-muted); justify-content: center;">No activity logs recorded yet.</div>`; 
                    return; 
                }
                box.innerHTML = '';
                globalLogs.forEach((log, index) => {
                    let badgeClass = 'badge-system';
                    if (log.type === 'batch') badgeClass = 'badge-batch';
                    else if (log.type === 'fallback') badgeClass = 'badge-fallback';
                    else if (log.type === 'scheduled') badgeClass = 'badge-scheduled';
                    else if (log.type === 'incoming') badgeClass = 'badge-incoming';

                    box.innerHTML += `
                        <div class="history-row" onclick="openLogDetails(${index})">
                            <span><span class="history-badge ${badgeClass}">${log.type}</span></span>
                            <span style="color: var(--neon-cyan); max-width: 150px; overflow: hidden; text-overflow: ellipsis;">${log.recipient}</span>
                            <span style="color: var(--text-main); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${log.message}</span>
                            <span style="color: var(--text-muted); font-size: 0.7rem;">${new Date(log.timestamp).toLocaleTimeString()}</span>
                        </div>
                    `;
                });
            } catch(e) {}
        }

        function openLogDetails(index) {
            const log = globalLogs[index];
            if (!log) return;
            const dt = new Date(log.timestamp);
            document.getElementById('modal-details-body').innerHTML = `
                <p><span>Event ID:</span> ${log.id}</p>
                <p><span>Type:</span> <strong style="color: var(--neon-cyan); text-transform:uppercase;">${log.type}</strong></p>
                <p><span>Date:</span> ${dt.toLocaleDateString()}</p>
                <p><span>Time:</span> ${dt.toLocaleTimeString()}</p>
                <p><span>Recipient / Target:</span> ${log.recipient}</p>
                <p><span>Message / Content:</span><br><div style="background: rgba(2,6,23,0.9); padding: 10px; border-radius: 6px; border: 1px solid #334155; margin-top: 4px; color: #38bdf8;">${log.message}</div></p>
                ${log.details && Object.keys(log.details).length ? `<p style="margin-top:10px;"><span>Extra Details:</span><br><pre style="font-size:0.75rem; color:#34d399; background:rgba(2,6,23,0.9); padding:8px; border-radius:6px;">${JSON.stringify(log.details, null, 2)}</pre></p>` : ''}
            `;
            document.getElementById('log-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('log-modal').style.display = 'none'; }

        window.onload = () => { fetchHistoryLogs(); setInterval(fetchHistoryLogs, 5000); };
    </script>
</body>
</html>
